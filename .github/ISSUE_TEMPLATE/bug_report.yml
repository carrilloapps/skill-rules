name: Bug report
description: Report a problem with skill-rules
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. Fill in as much detail as you can.

  - type: input
    id: version
    attributes:
      label: skill-rules version
      description: Run `sr --version` or `npx skill-rules --version`
      placeholder: '0.1.0'
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Run `node --version`
      placeholder: 'v20.0.0'
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true

  - type: input
    id: shell
    attributes:
      label: Shell
      placeholder: 'bash, zsh, PowerShell…'
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command you ran
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the full terminal output
      render: shell
    validations:
      required: true
